<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Data & AI Strategy — Douglas County, Oregon | Mouliqe</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../proposals/_presentation.css">
  <style media="print">
    .p-slide { display:flex!important; opacity:1!important; position:relative!important; transform:none!important; page-break-after:always; min-height:100vh; }
    .p-nav-arrow,.p-theme-toggle,.p-progress,.p-counter,.p-branding,.p-detail-overlay { display:none!important; }
    .p-deck { overflow:visible!important; height:auto!important; }
    .p-anim,.p-anim-left,.p-anim-scale { opacity:1!important; transform:none!important; }
    @page { size:landscape; margin:0.5cm; }
  </style>
</head>
<body>
  <div id="p-deck" class="p-deck"></div>
  <button class="p-theme-toggle" aria-label="Toggle theme"></button>
  <button class="p-nav-arrow p-nav-prev" aria-label="Previous slide">&#8249;</button>
  <button class="p-nav-arrow p-nav-next" aria-label="Next slide">&#8250;</button>
  <div class="p-progress"><div class="p-progress-fill"></div></div>
  <div class="p-counter"></div>
  <a class="p-branding" href="https://mouliqe.com" target="_blank" rel="noopener">mouliqe.com</a>
  <div class="p-detail-overlay">
    <div class="p-detail-panel">
      <button class="p-detail-close" aria-label="Close">&times;</button>
      <h3 class="p-detail-title"></h3>
      <div class="p-detail-body"></div>
    </div>
  </div>
  <script type="module">
    import { initPresentation } from '../../proposals/_presentation.js';
    import { meta, slides } from './slides.js';
    initPresentation({ meta, slides });
  </script>
</body>
</html>
